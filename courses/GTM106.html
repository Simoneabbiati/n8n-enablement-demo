 "concept": "Cloud versus self-hosted is the choice between using a vendor-managed deployment and running the platform on your own infrastructure. The right answer depends on what the customer is optimizing for: speed to start, operational ownership, security review, data handling, network access and governance requirements. In customer conversations, the goal is not to push one option first. The goal is to understand constraints, explain trade-offs clearly and avoid promising architecture details you have not confirmed [CHECK WITH PRODUCT].",

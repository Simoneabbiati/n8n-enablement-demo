<script id="course-data" type="application/json">{"id": "GTM111", "title": "Adoption plays", "path": "Customer Adoption and Expansion", "level": "Practitioner", "levelId": "L2", "minutes": 30, "roles": ["CSM", "PARTNER"], "competencies": ["Adoption and expansion"], "moments": ["Ramp (days 31-90)", "Launch readiness"], "assessment": ["Knowledge check"], "status": "Example draft, for review", "updated": "2026-10-15", "objective": "Plan adoption plays that help existing customers use more of n8n and reveal where expansion may follow.", "who_its_for": "Customer success managers and partners who work with live customers after launch or during early ramp. It assumes basic product familiarity and does not cover first-call discovery or full technical demo delivery.", "scenario": {"name": "Meridian Logistics", "problem": "A mid-market logistics company has launched a few useful workflows, but usage is uneven across teams. Some owners do not know what to automate next, and the account team needs a simple way to drive broader adoption without overloading the customer."}, "prerequisites": [], "concept": "An adoption play is a repeatable way to help a customer get value from the product after the first win. It links a customer segment, a common use case, a message, a next step and a simple success check. Good adoption plays are specific enough to act on, but light enough for a CSM or partner to run without a large project each time.", "lessons": [{"title": "What an adoption play is", "minutes": 7, "summary": "Define the parts of a repeatable play and when to use one after launch."}, {"title": "Choose the right accounts and moments", "minutes": 8, "summary": "Find which customers or client teams are ready for another workflow and which are not."}, {"title": "Message the next step clearly", "minutes": 7, "summary": "Turn a product capability into a short customer message tied to one business problem."}, {"title": "Track signals for expansion", "minutes": 8, "summary": "Use adoption activity and customer requests to spot where a broader rollout may make sense."}], "by_role": {"CSM": {"say": {"format": "Customer email", "text": "Subject: A practical next workflow for your team. I would point to one business process that still has manual handoffs, explain why it is a good fit for another n8n workflow, and offer a short working session to map it. I would also note what success would look like in simple terms so the customer knows this is a small, useful next step."}}, "PARTNER": {"say": {"format": "Implementation tips", "text": "Package adoption plays around repeatable client patterns, not around every new feature. Start with the workflows already live, identify the next adjacent process, and define the technical prerequisites before you suggest scope. If a play depends on product behavior you have not verified, mark it for review [CHECK WITH PRODUCT]."}, "show": {"format": "Lab steps", "steps": ["Pick one existing workflow in your own n8n instance and write down the business process it supports.", "Create a short adoption play brief with four fields: target user, next use case, message and success check.", "Build or duplicate a simple workflow that represents the next adjacent use case for that same customer team.", "Document any prerequisites, such as credentials, data access or approvals, inside the workflow notes.", "Run the workflow once and confirm that the outcome matches the play brief you wrote.", "Export the workflow and brief so they can be reviewed as a reusable client delivery asset."]}}}, "objections": [{"q": "We have already launched. Why do we need a formal adoption play?", "a": "Because first value does not guarantee wider use. A simple play helps the customer choose the next workflow instead of waiting until momentum fades."}, {"q": "We do not want to push more change on the team right now.", "a": "Then keep the play small. Focus on one adjacent process, one owner and one clear outcome rather than a broad rollout."}, {"q": "Our client wants ideas, but not another large implementation.", "a": "That is exactly where a light adoption play helps. It frames a contained next step and surfaces prerequisites before anyone commits to more scope."}], "gotchas": ["Do not send a feature-led email with no link to the customer's current workflow pain.", "Do not treat every active account as ready for expansion; confirm ownership, capacity and a clear next use case first.", "In partner delivery, do not suggest a reusable pattern before you have checked the client's data access and approval needs."], "practice": {"type": "Role-play", "brief": "Choose Meridian Logistics and design a short adoption play for one team that already uses n8n for a live workflow. Then explain your play to a colleague acting as the customer owner or client sponsor.", "rubric": [{"criterion": "Targets the right account or team", "good": "Explains why this customer segment is ready for a next workflow and names one reason another segment may not be."}, {"criterion": "Ties the message to a business problem", "good": "Describes the manual step or process gap before mentioning product capabilities."}, {"criterion": "Defines a practical next action", "good": "Proposes one realistic next workflow or working session with clear prerequisites."}, {"criterion": "Surfaces expansion signals carefully", "good": "Notes what customer behavior would suggest broader rollout potential without overcommitting."}]}, "check": [{"q": "What makes an adoption play different from a general product update?", "answer": "An adoption play is tied to a specific customer segment, use case and next action. It tells the customer what to do next and why it matters for their process."}, {"q": "What should a CSM look for before suggesting the next workflow?", "answer": "They should check that the customer has a live use case, a clear owner and a nearby manual process worth improving. They should also avoid pushing accounts that are not ready for change."}, {"q": "How can a partner use adoption plays well across clients?", "answer": "A partner can turn common client patterns into repeatable delivery motions. The key is to confirm prerequisites and fit before presenting the play as a reusable best practice."}]}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';

  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

<script id="course-data" type="application/json">{
 "id": "GTM111",
 "title": "Adoption plays",
 "path": "Customer Adoption and Expansion",
 "level": "Practitioner",
 "levelId": "L2",
 "minutes": 30,
 "roles": [
  "CSM",
  "PARTNER"
 ],
 "competencies": [
  "Adoption and expansion"
 ],
 "moments": [
  "Ramp (days 31-90)",
  "Launch readiness"
 ],
 "assessment": [
  "Knowledge check"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Build simple adoption plays that help customers use more of n8n and reveal where expansion may follow.",
 "who_its_for": "Customer success managers and partners who work with active n8n customers after the first sale. It assumes the customer already has an initial use case live; deep technical implementation design is out of scope.",
 "scenario": {
  "name": "Meridian Logistics",
  "problem": "A mid-market logistics company has launched a few workflows for order and support operations, but usage is uneven across teams and new capabilities are not reaching the people who could use them next."
 },
 "prerequisites": [],
 "concept": "An adoption play is a repeatable way to help a customer get value from what they already bought. It starts with a customer segment, a likely need and one clear action, such as reviewing a workflow, introducing a relevant capability or helping a new team copy a proven pattern. Good adoption plays are simple, timed to a real customer moment and easy to measure with signals you can observe [CHECK WITH PRODUCT].",
 "lessons": [
  {
   "title": "What an adoption play is",
   "minutes": 7,
   "summary": "Define the customer problem, the target segment and the next action without turning it into a generic check-in."
  },
  {
   "title": "Choose the right accounts",
   "minutes": 8,
   "summary": "Find which customers are most likely to benefit based on their current workflows, team setup and stage of rollout."
  },
  {
   "title": "Run the outreach",
   "minutes": 7,
   "summary": "Write a short message that connects one capability or best practice to one operational outcome the customer cares about."
  },
  {
   "title": "Spot expansion signals",
   "minutes": 8,
   "summary": "Separate healthy adoption from signs that another team, environment or use case may need support [CHECK WITH PRODUCT]."
  }
 ],
 "by_role": {
  "CSM": {
   "say": {
    "format": "Customer email",
    "text": "Subject: A practical next step for your n8n rollout. I would send a short note to Meridian Logistics that names one team already seeing value, one similar workflow pattern another team could reuse, and one offer to review it together in a 20-minute session."
   }
  },
  "PARTNER": {
   "say": {
    "format": "Implementation tips",
    "text": "Build adoption into delivery from the start. Leave the client with named workflow patterns, owners and review points so the first project becomes a repeatable model for the next team. When a new capability is relevant, explain the client problem it fits before you discuss product detail."
   },
   "show": {
    "format": "Lab steps",
    "steps": [
     "In your own n8n instance, list three active customer workflow patterns you already know how to build or support.",
     "For each pattern, write one likely follow-on use case for another team at the same customer.",
     "Draft one short client outreach note for the strongest follow-on use case and include a clear next meeting ask.",
     "Create a simple review checklist you would use 30 days after go-live to confirm adoption health and look for expansion signals."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "We already launched the workflows. Why do we need a separate adoption motion?",
   "a": "Launch is not the same as repeat usage. An adoption play helps the customer extend a working pattern to the next team or process instead of letting the first win stay isolated."
  },
  {
   "q": "I do not want to email every customer about every new capability.",
   "a": "Do not. Start with the accounts and use cases that clearly match, and keep the message tied to one problem they already have."
  },
  {
   "q": "How do I talk about expansion without sounding sales-led?",
   "a": "Frame it as operational fit. If another team has the same manual process, it is reasonable to explore whether the current approach should be reused there."
  }
 ],
 "gotchas": [
  "Do not send broad feature updates with no customer context.",
  "Do not treat every active account as ready for expansion at the same time.",
  "In client reviews, avoid proposing a new use case before you confirm the first one is adopted by the intended users."
 ],
 "practice": {
  "type": "Role-play",
  "brief": "You are preparing a 15-minute adoption review for Meridian Logistics after its first workflows went live. Explain which team you would contact next, what you would say and what signal would make you explore expansion.",
  "rubric": [
   {
    "criterion": "Targets the right account segment",
    "good": "Chooses a customer group based on current usage, workflow similarity or rollout stage, not guesswork."
   },
   {
    "criterion": "Clear adoption play",
    "good": "Defines one customer problem, one relevant next step and one simple outreach message."
   },
   {
    "criterion": "Expansion judgment",
    "good": "Identifies a credible expansion signal without forcing a sales pitch before adoption is established."
   },
   {
    "criterion": "Practical language",
    "good": "Uses short, specific wording a customer could understand without product jargon."
   }
  ]
 },
 "check": [
  {
   "q": "What makes an adoption play different from a generic customer check-in?",
   "answer": "It is built around a specific customer segment, a likely need and one clear next action. It should help the customer do something useful, not just attend a meeting."
  },
  {
   "q": "What should a good customer adoption email include?",
   "answer": "A short description of the customer problem, one relevant next use case or best practice, and a clear ask for the next conversation."
  },
  {
   "q": "When should you look for expansion signals?",
   "answer": "After the first use case shows signs of real adoption, or when another team has a similar operational problem that the current pattern could fit."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

<script id="course-data" type="application/json">{
 "id": "GTM107",
 "title": "Discovery that finds automation value",
 "path": "Discovery and Demo Certification",
 "level": "Practitioner",
 "levelId": "L2",
 "minutes": 45,
 "roles": [
  "AE_MM",
  "AE_ENT",
  "SE"
 ],
 "competencies": [
  "Discovery",
  "Value and ROI"
 ],
 "moments": [
  "Ramp (days 31-90)"
 ],
 "assessment": [
  "Certification"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Run a discovery conversation that finds valuable automation problems, qualifies fit and sets up a focused next step.",
 "who_its_for": "Account executives and solutions engineers who already know the basics of n8n and now need a repeatable discovery approach. It assumes you can describe n8n at a high level; detailed product deep dives and full demo delivery are out of scope.",
 "scenario": {
  "name": "Meridian Logistics",
  "problem": "A mid-market logistics company runs order updates, customer support and internal reporting across many SaaS tools. Teams re-enter data by hand, requests queue up with engineering and leaders cannot see which automation work is worth doing first."
 },
 "prerequisites": [],
 "concept": "Discovery for automation is the work of finding where manual steps, system gaps and process risk create enough pain to justify change. The goal is not to list features. The goal is to understand the workflow, who owns it, what breaks today, what the business impact is and whether n8n is a fit now. Good discovery gives you a problem worth solving, a reason to solve it soon and a clear path to the next conversation.",
 "lessons": [
  {
   "title": "What good automation discovery sounds like",
   "minutes": 10,
   "summary": "Learn the difference between a feature-led call and a problem-led call, and what evidence of value to listen for."
  },
  {
   "title": "Map the workflow before you map the product",
   "minutes": 12,
   "summary": "Use a simple structure to uncover trigger, systems, steps, owners, exceptions and handoffs."
  },
  {
   "title": "Find value, urgency and fit",
   "minutes": 10,
   "summary": "Turn process pain into a clear business case by asking about time, risk, backlog, governance and timing."
  },
  {
   "title": "Handle weak signals and disqualify early",
   "minutes": 6,
   "summary": "Spot when the problem is too small, too unclear or blocked by missing sponsorship, and know when not to pitch."
  },
  {
   "title": "Set up the next step",
   "minutes": 7,
   "summary": "End discovery with a sharp recap, an agreed use case and the right follow-up for sales or technical validation."
  }
 ],
 "by_role": {
  "AE_MM": {
   "say": {
    "format": "Talk track",
    "text": "Before we talk about product, I want to understand where work is still manual across your tools and what that costs your team each week. Which process breaks most often or pulls engineers into low-value integration work? If the issue is just one isolated task with little business impact, I would not push an automation platform yet."
   }
  },
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "I want to understand which cross-system processes matter enough to need a governed approach, not just another point script. Where do security review, audit needs or platform standards slow down automation work today? If this is only a local team problem with no governance or scale concern, we may not have a strong enterprise case yet."
   }
  },
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "My job in discovery is to get precise about the workflow shape before I recommend an approach. I need to know the trigger, source systems, target systems, decision points, failure cases and who will own it. If we skip that detail, the demo looks good but the proof of concept fails on day one."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Sketch the customer's current workflow in plain steps on a whiteboard or slide before opening n8n.",
     "Translate those steps into a simple workflow with a trigger, two system actions and one branch for an exception case.",
     "Run sample data through the workflow and show where you would inspect payloads and outputs.",
     "Call out any prerequisites, such as access to source systems or approval to test with live data [CHECK WITH PRODUCT].",
     "Offer to package the example as an importable workflow after the call if the use case is qualified."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "We already know our processes are messy. Why spend time on discovery?",
   "a": "Because not every messy process is worth automating first. Discovery helps you find the process with clear impact, feasible scope and an owner who will drive it."
  },
  {
   "q": "Can you just show the demo first and we will tell you if it fits?",
   "a": "A short demo is useful, but without workflow context it often answers the wrong question. Ten minutes of discovery usually makes the demo more relevant and more honest."
  },
  {
   "q": "We can build integrations ourselves.",
   "a": "You may be able to. Discovery should test whether the issue is simple enough for that path or whether the team needs a more repeatable way to build, change and govern automations."
  }
 ],
 "gotchas": [
  "Do not jump into nodes and integrations before the customer has described the current process.",
  "Do not accept vague pain like \"we need efficiency\" without asking where the work happens and who feels it.",
  "Do not promise a strong ROI if the customer cannot describe volume, delay, risk or backlog in concrete terms."
 ],
 "practice": {
  "type": "Role-play",
  "brief": "Run a 15-minute discovery call with the operations lead at Meridian Logistics. Find one automation use case, qualify the business impact, test fit and close with a clear next step.",
  "rubric": [
   {
    "criterion": "Starts with the workflow, not the product",
    "good": "Asks the customer to describe the current process, systems, handoffs and failure points before discussing n8n."
   },
   {
    "criterion": "Finds measurable value",
    "good": "Uncovers at least one clear source of impact such as manual effort, delay, engineering backlog, error risk or governance burden."
   },
   {
    "criterion": "Qualifies fit honestly",
    "good": "Identifies one reason n8n could fit and one condition that still needs validation, or states clearly when not to pursue."
   },
   {
    "criterion": "Sets a useful next step",
    "good": "Ends with a concise recap of the use case, buyer need and the right follow-up call, demo or technical review."
   }
  ]
 },
 "check": [
  {
   "q": "What should you understand before you start mapping n8n features to a use case?",
   "answer": "You should understand the current workflow first: the trigger, systems involved, manual steps, owners, exceptions and where the process breaks."
  },
  {
   "q": "What makes an automation opportunity strong enough to pursue?",
   "answer": "There is a clear business problem, an identifiable owner, meaningful impact and a next step that can validate fit. If those are missing, the opportunity may not be ready."
  },
  {
   "q": "When should you avoid pitching n8n too early in discovery?",
   "answer": "Avoid it when the customer has not yet described the problem clearly or when the issue appears too small, isolated or weakly owned to justify a platform discussion."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

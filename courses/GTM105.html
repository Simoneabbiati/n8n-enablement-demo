<script id="course-data" type="application/json">{
 "id": "GTM105",
 "title": "AI agents in n8n",
 "path": "Technical Proficiency",
 "level": "Practitioner",
 "levelId": "L2",
 "minutes": 60,
 "roles": [
  "SE",
  "AE_ENT",
  "PARTNER"
 ],
 "competencies": [
  "Technical proficiency",
  "Value and ROI"
 ],
 "moments": [
  "Ramp (days 31-90)",
  "Launch readiness"
 ],
 "assessment": [
  "Hands-on lab",
  "Knowledge check"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Explain how AI agents are built and evaluated in n8n, and show when they fit an enterprise workflow.",
 "who_its_for": "Solutions engineers, enterprise account executives and partners who need to discuss or show AI agent workflows with technical buyers. It assumes basic n8n workflow knowledge; deep model selection, prompt engineering theory and security review detail are out of scope.",
 "scenario": {
  "name": "Aurora Bank",
  "problem": "A regulated enterprise wants to test AI agents for internal operations, but the platform team needs tight control over where workflows run, how data moves and how human review is added before actions are taken."
 },
 "prerequisites": [
  {
   "code": "N8N103",
   "title": "In Practice: AI, Testing & Best Practices",
   "url": "https://learn.n8n.io/courses/course-v1:n8n+N8N103+2026H2/about"
  }
 ],
 "concept": "An AI agent workflow uses a language model to reason through a task, choose from available tools and return an output or take an action inside a broader automation. In n8n, the useful question is not just whether an agent can answer, but how it is grounded with data, how its steps are controlled, where human review is needed and how it fits the rest of the workflow. For customers, this makes AI agents less of a stand-alone experiment and more of an operational process that can be tested, monitored and adapted [CHECK WITH PRODUCT].",
 "lessons": [
  {
   "title": "What an AI agent workflow is",
   "minutes": 12,
   "summary": "Define the parts of an agent workflow and separate agent behavior from standard workflow automation."
  },
  {
   "title": "Where agents fit in enterprise processes",
   "minutes": 14,
   "summary": "Show the use cases that suit an agent, and the cases where fixed logic is safer and simpler."
  },
  {
   "title": "Building the flow in n8n",
   "minutes": 16,
   "summary": "Walk through trigger, context, tools, model call, output handling and human review steps."
  },
  {
   "title": "Testing, limits and live demo handling",
   "minutes": 10,
   "summary": "Cover what to validate before a demo and how to explain uncertainty, guardrails and fallbacks."
  },
  {
   "title": "Talking to buyers and delivery teams",
   "minutes": 8,
   "summary": "Translate the technical design into business, governance and implementation language for each role."
  }
 ],
 "by_role": {
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "An AI agent workflow is useful when the task needs judgment across changing inputs, but still needs clear boundaries. In n8n, I would show the model, the tools it can use, the data it can access and the review step before any sensitive action. I would also say where I would use fixed workflow logic instead of an agent."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Start with a workflow trigger that receives a customer request or internal ticket.",
     "Add the agent step and show the instructions, the allowed tools and the data source it can reference [CHECK WITH PRODUCT].",
     "Run a sample input and inspect each step so the customer can see what context goes in and what output comes back.",
     "Add a conditional path or approval step for cases where the output should be reviewed before action is taken.",
     "Show the final action node, then explain the fallback path for low-confidence or malformed outputs [CHECK WITH PRODUCT]."
    ]
   }
  },
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "The business case is not just that AI answers questions. It is that your team can place AI inside governed workflows, connect it to the systems you already use and add review before action. For a CTO, the key questions are where it runs, what data it can touch and when an agent is the right tool versus standard automation or custom code."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Frame the use case in business terms, such as triaging internal requests or drafting responses for review.",
     "Show the workflow view and point out where the model step sits inside a larger controlled process.",
     "Highlight the approval or exception path before any system update is made.",
     "Close by showing that the workflow can be adapted for the customer's hosting and review requirements [CHECK WITH PRODUCT]."
    ]
   }
  },
  "PARTNER": {
   "say": {
    "format": "Implementation tips",
    "text": "Start client projects with one bounded task, one clear data source and one review rule. Keep the workflow easy to inspect, and separate the agent decision step from system actions so testing is simpler. Be ready to tell clients where deterministic logic is better than an agent, especially in regulated or high-risk flows."
   },
   "show": {
    "format": "Lab steps",
    "steps": [
     "Create a workflow in your own n8n instance with a trigger, an agent step and one downstream action [CHECK WITH PRODUCT].",
     "Connect the agent to a simple reference source or input so the output is based on defined context.",
     "Add an approval or exception branch that stops the workflow when the response does not meet your rule.",
     "Run multiple test inputs and save the workflow in a state that another consultant can review and reuse."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "Why not just build this directly with an LLM API and some code?",
   "a": "That can be the right choice for some teams. The customer should compare build effort, maintainability, visibility of the process and how easily non-developers can review and change the flow over time."
  },
  {
   "q": "AI agents are unpredictable, so we cannot use them in serious processes.",
   "a": "That is exactly why the use case matters. Position agents for bounded tasks, add review before sensitive actions and use fixed workflow logic where consistency matters more than flexibility."
  },
  {
   "q": "We need self-hosting and strict control of enterprise data.",
   "a": "That is a hosting and architecture conversation that should be handled carefully. Confirm the customer's requirements and validate the exact deployment and data-handling details with product and solutions teams [CHECK WITH PRODUCT]."
  }
 ],
 "gotchas": [
  "Do not present an agent as if it should replace every decision in a workflow.",
  "Avoid live prompts or inputs you have not tested, because the output may drift from the story you need to show.",
  "Do not guess on model support, hosting details or governance features; mark them for confirmation."
 ],
 "practice": {
  "type": "Hands-on lab",
  "brief": "In your own n8n instance, build a simple AI agent workflow for Aurora Bank that receives a request, uses defined context, routes uncertain outputs for review and only then takes a downstream action. The grader checks that the workflow has an input trigger, an agent step, a review or exception branch and a final action path [CHECK WITH PRODUCT].",
  "rubric": [
   {
    "criterion": "Required workflow structure",
    "good": "The grader finds a trigger, an AI agent step, a review or exception path and a downstream action in the workflow."
   },
   {
    "criterion": "Safe control of actions",
    "good": "The grader confirms that sensitive actions do not run on every path and that one path stops or waits for review."
   },
   {
    "criterion": "Use of defined context",
    "good": "The grader confirms the agent step receives structured input or reference data instead of a free-form prompt alone [CHECK WITH PRODUCT]."
   },
   {
    "criterion": "Clarity and reusability",
    "good": "The workflow is named clearly, nodes are organized logically and another builder can understand the intended path from the canvas."
   }
  ]
 },
 "check": [
  {
   "q": "When is an AI agent a better fit than fixed workflow logic?",
   "answer": "Use an agent when the task needs judgment across variable inputs and can be bounded with tools, context and review. Use fixed logic when the process must be fully predictable."
  },
  {
   "q": "What should an SE show in an AI agent demo besides the model output?",
   "answer": "Show the trigger, the context the agent receives, the tools it can use, the review or exception path and the final action. The point is to show control, not just the answer."
  },
  {
   "q": "What is one safe way to position AI agents to an enterprise buyer?",
   "answer": "Position them as one step inside a governed workflow, not as an unchecked replacement for business logic. Then discuss data access, hosting requirements and human review."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

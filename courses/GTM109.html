 "status": "Example draft, for review",

 "objective": "Handle enterprise security, compliance and governance questions with clear, accurate answers and a focused demo path.",
 "who_its_for": "Enterprise account executives and solutions engineers preparing for regulated or security-heavy deals. It assumes basic product familiarity and is not a deep implementation course for security administrators.",
 "scenario": {
  "name": "Aurora Bank",
  "problem": "A regulated enterprise wants to automate internal processes and test AI agents, but the security team requires a strict review, strong governance and a self-hosted deployment before any pilot can begin."
 },
 "prerequisites": [],
 "concept": "Security, compliance and governance are the questions enterprise buyers ask before they agree to evaluate or deploy an automation platform. In practice, they want to know where the platform runs, how access is controlled, how workflows are reviewed and monitored, and whether their teams can manage risk as usage grows. Your job is not to recite a feature list. It is to connect the buyer's control requirements to the right deployment model, operating model and proof points, and to flag any uncertain claim for confirmation [CHECK WITH PRODUCT].",
 "lessons": [
  {
   "title": "What enterprise buyers are really asking",
   "minutes": 10,
   "summary": "Translate security, compliance and governance questions into a few core concerns: control, visibility, access and risk."
  },
  {
   "title": "How to frame deployment and data control",
   "minutes": 11,
   "summary": "Explain when self-hosting enters the conversation and how to discuss infrastructure and data handling without overclaiming."
  },
  {
   "title": "Governance in day-to-day operations",
   "minutes": 10,
   "summary": "Cover access, workflow ownership, change control and operational guardrails in plain language."
  },
  {
   "title": "Handling objections from security and IT",
   "minutes": 8,
   "summary": "Practise short, honest answers to common review questions and know when to bring in specialist support."
  },
  {
   "title": "Demo and certification prep",
   "minutes": 6,
   "summary": "Use a simple technical flow to show control points without turning the meeting into a product tour."
  }
 ],
 "by_role": {
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "For teams like yours, the question is not only what can be automated. It is whether your platform team can control where it runs, who can build, and how usage is governed over time. If self-hosting and strict review are part of the path, we should test that fit early and bring in the right technical stakeholders rather than treating security as a late-stage checkbox."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Start with the target operating model: who builds workflows, who approves them and where the platform would run.",
     "Open one simple workflow and show that the logic is visible step by step rather than hidden in scripts.",
     "Point out the places the customer will want to govern, such as credentials, access, change review and runtime operations [CHECK WITH PRODUCT].",
     "Tie the workflow back to the bank's review process and note which detailed questions should move to a security session.",
     "End by confirming whether self-hosting and governance requirements are mandatory for the pilot."
    ]
   }
  },
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "Security reviews usually need a clear map of deployment, access, secrets handling, workflow visibility and operational ownership. I keep the discussion concrete: what runs where, what the customer team controls, what must be configured well, and which answers need product or security validation [CHECK WITH PRODUCT]."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Use a prebuilt workflow with a simple trigger, one system action and one approval or notification step.",
     "Show the workflow structure so the evaluator can see what happens at each step and where credentials are used.",
     "Explain the deployment context for the demo and whether the customer's target state is cloud or self-hosted [CHECK WITH PRODUCT].",
     "Call out governance points such as role boundaries, workflow ownership, review process and monitoring approach [CHECK WITH PRODUCT].",
     "Pause on any question that needs exact product confirmation and note the follow-up action instead of guessing."
    ]
   }
  }
 },
 "objections": [

   "q": "We cannot use a platform unless it is self-hosted.",

  {

  },
  {
   "q": "We can build this ourselves and avoid platform risk.",
   "a": "You can acknowledge that option. Then compare the ongoing burden of visibility, maintenance, change management and team-wide governance, not just the first build."
  }
 ],
 "gotchas": [

  "Do not let the conversation stay abstract. Anchor every answer to the customer's operating model and review process.",
  "In a demo, do not show a workflow that uses services or data the customer would never approve in their target environment."
 ],
 "practice": {
  "type": "Role-play",
  "brief": "Run a late-stage meeting with Aurora Bank. One learner plays the enterprise AE or SE, one plays the bank's security lead, and one plays the CTO sponsor. The goal is to qualify the deployment requirement, answer governance concerns, and agree on the next technical review without making unsupported claims.",
  "rubric": [
   {
    "criterion": "Starts from risk and operating model",
    "good": "Frames the discussion around where the platform runs, who uses it and how it will be governed before moving into product detail."

   {
    "criterion": "Handles objections honestly",
    "good": "Answers common pushback directly, avoids overclaiming and flags uncertain points for confirmation."
   },
   {
    "criterion": "Shows a controlled demo path",
    "good": "Uses a simple workflow to illustrate visibility and governance points rather than giving a broad feature tour."
   },
   {
    "criterion": "Advances the deal correctly",

   }

   "q": "What is the difference between security questions and governance questions in this course?",
   "answer": "Security questions focus on risk, control and protection. Governance questions focus on who can build, approve, change and operate workflows over time."
  },
  {
   "q": "What should you do if a buyer asks for a product detail you are not certain about?",
   "answer": "Do not guess. State the likely direction carefully if appropriate, mark it for confirmation and bring in the right product or security resource [CHECK WITH PRODUCT]."
  }
 ]

<script>
(function(){

  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');

  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;

  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');

  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');

    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};

  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);

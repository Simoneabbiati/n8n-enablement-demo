 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Explain how triggers, nodes and integrations work together in n8n, and demonstrate a simple workflow with clear prerequisites and limits.",
 "who_its_for": "Solutions engineers, enterprise account executives and partners who are past basic onboarding and now need to speak credibly about how workflows connect to other systems. It assumes a basic understanding of what n8n is; deep API design and advanced deployment topics are out of scope.",
 "scenario": {
  "name": "Meridian Logistics",
  "problem": "A mid-market logistics company uses many SaaS tools for orders, support and internal operations. The team needs workflows that can start reliably, move data between systems and handle cases where one tool does not have the exact action they need."
 },
 "prerequisites": [
  {

   "title": "Integrations: APIs & Connected Workflows",
   "url": "https://learn.n8n.io/courses/course-v1:n8n+N8N102+2026H2/about"
  }
 ],
 "concept": "A workflow is built from three practical parts: how it starts, what each step does and how it connects to other systems. In n8n, triggers start the workflow, nodes process data or take actions, and integrations connect those steps to SaaS tools, databases, APIs or custom logic. This matters in customer conversations because buyers are often not asking for a visual builder by itself. They are asking whether their systems can start the right process, pass the right data and still work when the standard connector is not enough.",
 "lessons": [
  {
   "title": "Triggers: how workflows start",
   "minutes": 15,
   "summary": "What triggers are, common trigger types and how to explain when a workflow runs versus when it waits."
  },
  {
   "title": "Nodes: what happens to the data",
   "minutes": 15,
   "summary": "How nodes transform, route and act on data, and how to describe this clearly in a demo."
  },
  {
   "title": "Integrations: connectors, APIs and custom logic",
   "minutes": 15,
   "summary": "When to use a standard integration, when to call an API directly and when code is the safer answer."
  },
  {
   "title": "Demo pattern and live-call risks",
   "minutes": 15,
   "summary": "A simple demo flow, the prerequisites to confirm first and the mistakes that usually derail technical calls."
  }
 ],
 "by_role": {
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "I will show this in three parts: what starts the workflow, how data moves through each node and how we connect to systems that do or do not have a ready-made integration. If a standard node is not enough, we can usually call an API or add code, but I will flag any product-specific limit we have not verified [CHECK WITH PRODUCT]."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Create a workflow with one trigger that is easy to explain, such as a webhook or schedule.",
     "Add a small sequence of nodes that receives data, transforms one field and sends the result to another system.",
     "Run the workflow once and inspect the input and output at each node so the customer can see how data changes.",
     "Replace one action with an HTTP request or code step to show how you handle cases where a prebuilt node is not the right fit.",
     "Close by naming the prerequisites, such as credentials, test data and API access, before discussing scale or production design."
    ]
   }
  },
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "The business question is not just whether a workflow can connect two apps. It is whether your team gets a governed way to trigger processes, pass data across systems and handle exceptions without building every integration from scratch. A good discovery question is: where do your teams lose time today because a process starts in one system but the next step still depends on manual handoff. Do not pitch this as a simple app-to-app connector if the buyer's real concern is governance, security review or operating custom integrations at enterprise scale."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Show a workflow that starts from a controlled trigger, not a toy example with unclear business value.",
     "Walk through each node in business terms: start event, validation, system update and notification.",
     "Point out where credentials are required and where a team may prefer an API call or custom logic for internal systems.",
     "End with a short discussion of what would need review from security, platform or architecture teams before production use."
    ]
   }
  },
  "PARTNER": {
   "say": {
    "format": "Implementation tips",
    "text": "Start every client project by mapping three things first: trigger source, required data fields and target system actions. Use standard integrations when they fit, but plan early for the cases where the client needs an API call, data transformation or error handling path. Tell clients clearly what you need from them before the build starts, especially credentials, sample payloads and access to test environments."
   },
   "show": {
    "format": "Lab steps",
    "steps": [
     "Build a workflow in your own n8n instance with one trigger, one transformation step and one outbound action.",
     "Use sample data that includes at least one field you must rename, format or split before sending onward.",
     "Add one step that uses an API request or equivalent custom connection path instead of relying only on a standard node.",
     "Test the workflow end to end and confirm that each node output is understandable to another consultant who inherits the project.",
     "Save the workflow in a form you can reuse as a starting template for future client work."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "What if the system we need is not covered by a native integration?",
   "a": "Do not guess. Explain that many teams use API calls or code for gaps, then confirm the exact requirement and validate it against the product before promising fit [CHECK WITH PRODUCT]."
  },
  {
   "q": "Why not just have engineers build these integrations directly?",
   "a": "They can. The value discussion is about speed, visibility and maintainability for recurring workflow logic, not about claiming code is never needed."
  },
  {
   "q": "Are triggers reliable enough for important operational processes?",
   "a": "That depends on the trigger type, the connected systems and the workflow design. Keep the answer honest and move quickly to design prerequisites, testing and operational review rather than broad claims [CHECK WITH PRODUCT]."
  }
 ],
 "gotchas": [
  "Using a demo trigger that looks simple but does not match the customer's real starting event.",
  "Failing to test credentials, sample payloads or API permissions before the call.",
  "Claiming a native integration can cover a use case when the real need is a custom API request or code step."
 ],
 "practice": {
  "type": "Hands-on lab",
  "brief": "In your own n8n instance, build a workflow for Meridian Logistics that starts from one trigger, transforms incoming order data and sends the result to a second system. Include one standard node and one step that handles a connection through an API-style request or equivalent custom path. The automatic grader checks structure and evidence that the workflow ran with sample data.",
  "rubric": [
   {
    "criterion": "Workflow structure",
    "good": "The grader finds one trigger, at least one transformation step and at least one outbound action in the workflow."
   },
   {
    "criterion": "Data handling",

   },
   {
    "criterion": "Custom connection path",
    "good": "The grader finds one step that is not only a basic prebuilt action, such as an HTTP request or code-based handling."
   },
   {
    "criterion": "Runnable result",
    "good": "The grader finds a successful test execution with sample data passing through the main path of the workflow."
   }
  ]
 },
 "check": [
  {
   "q": "What is the difference between a trigger and a node in a workflow?",
   "answer": "A trigger starts the workflow when an event or schedule occurs. A node is a step inside the workflow that transforms data, makes a decision or takes an action."
  },
  {
   "q": "When should you discuss APIs or code in this course?",
   "answer": "Discuss them when a standard integration does not fit the customer's exact requirement or when the team needs more control over the logic. Do not present them as required for every workflow."
  },
  {
   "q": "What should you confirm before running a live integration demo?",
   "answer": "Confirm credentials, test data, API access and the exact systems and actions you plan to show. Also confirm any product limits you are not fully sure about before you make a claim."
  }
 ]

<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};

  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;

  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};

      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};

  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');

  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;

  var done=new Set(store.get('gtm-academy-done',[]));

  var btn=$('complete');

  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();

    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);

  $('c-updated').textContent='Last updated '+C.updated;
})();

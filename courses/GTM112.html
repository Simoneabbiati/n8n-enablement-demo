<script id="course-data" type="application/json">{
 "id": "GTM112",
 "title": "Expansion signals",
 "path": "Customer Adoption and Expansion",
 "level": "Practitioner",
 "levelId": "L2",
 "minutes": 30,
 "roles": [
  "CSM",
  "PARTNER"
 ],
 "competencies": [
  "Adoption and expansion",
  "Value and ROI"
 ],
 "moments": [
  "Continuous"
 ],
 "assessment": [
  "Knowledge check"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Identify expansion signals in customer behavior and turn them into timely, relevant follow-up actions.",
 "who_its_for": "Customer success managers and partners who work with existing customers over time. It assumes you already know the customer's workflows and goals; it does not cover first-call discovery or technical demos.",
 "scenario": {
  "name": "Pixel & Co.",
  "problem": "An automation agency supports several client accounts on n8n. Some clients have clear room to grow, but the team lacks a simple way to spot which signals mean more use cases, more stakeholders or a larger delivery need."
 },
 "prerequisites": [],
 "concept": "An expansion signal is a change in customer behavior, team structure or business need that suggests the account may be ready for broader use of n8n. The point is not to push a larger deal too early. The point is to notice when the customer is already showing demand, then connect that signal to a useful next step such as a new workflow, a governance conversation or a broader rollout plan.",
 "lessons": [
  {
   "title": "What counts as an expansion signal",
   "minutes": 8,
   "summary": "Learn the difference between real buying or adoption signals and weak activity that means little on its own."
  },
  {
   "title": "Signals by account type",
   "minutes": 7,
   "summary": "See how signals differ for a direct customer account versus a partner-led client delivery."
  },
  {
   "title": "What to do next",
   "minutes": 8,
   "summary": "Match each signal to a practical follow-up action, message and owner."
  },
  {
   "title": "Avoid false positives",
   "minutes": 7,
   "summary": "Learn when not to treat activity as expansion and how to confirm value before acting."
  }
 ],
 "by_role": {
  "CSM": {
   "say": {
    "format": "Customer email",
    "text": "Subject: A few signs your team may be ready for the next set of workflows. I would share the patterns I am seeing across your current use cases, point out where more teams or processes may benefit, and suggest one short review to confirm whether there is a real expansion opportunity."
   }
  },
  "PARTNER": {
   "say": {
    "format": "Implementation tips",
    "text": "Track signals during delivery, not just at renewal time. When a client asks for similar workflows in new teams, tighter controls, or support for more systems, treat that as a cue to propose the next phase with clear scope and best practices."
   },
   "show": {
    "format": "Lab steps",
    "steps": [
     "Review one active client account and list the workflows already delivered, the teams using them and any open requests.",
     "Sort the requests into three groups: more volume, more departments, or more complex requirements such as governance or security [CHECK WITH PRODUCT].",
     "Write one expansion hypothesis for each group, linked to a customer problem and a likely next project.",
     "Draft a short client update that names the signal, the risk of doing nothing and the next step you recommend."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "We do not want to look like we are always trying to upsell.",
   "a": "That is fair. Start with observed usage and business need, not package size or price. If there is no clear customer outcome, do not force an expansion conversation."
  },
  {
   "q": "More workflow activity does not always mean they want to expand.",
   "a": "Correct. Treat activity as a signal to investigate, not proof. Confirm whether new teams, new processes or new requirements are actually appearing."
  },
  {
   "q": "Our client has interest, but no budget yet.",
   "a": "Then keep the conversation focused on prioritization and value. Help them define the next use case and the cost of delay, so the request is ready when budget opens."
  }
 ],
 "gotchas": [
  "Do not confuse one active builder with broad account adoption.",
  "Do not raise expansion before the current use case is stable and delivering value.",
  "Do not assume every request for help means a larger project; some requests are just support needs."
 ],
 "practice": {
  "type": "Role-play",
  "brief": "Review a Pixel & Co. client account and identify two real expansion signals and one false positive. Then explain what follow-up you would take and why.",
  "rubric": [
   {
    "criterion": "Signal quality",
    "good": "Distinguishes clear signals from weak activity and explains the difference in plain terms."
   },
   {
    "criterion": "Action plan",
    "good": "Matches each valid signal to a specific next step, owner and customer outcome."
   },
   {
    "criterion": "Customer relevance",
    "good": "Frames the follow-up around the client's business need, not around selling more by default."
   },
   {
    "criterion": "Judgment",
    "good": "Names at least one case where no expansion conversation should happen yet."
   }
  ]
 },
 "check": [
  {
   "q": "What is an expansion signal?",
   "answer": "It is a change in customer behavior, need or scope that suggests the account may be ready for broader use of n8n. It is a reason to investigate, not automatic proof of a larger opportunity."
  },
  {
   "q": "Why is it risky to act on usage alone?",
   "answer": "Usage can reflect one busy user or temporary project work. You need to confirm whether the activity maps to a wider business problem, more stakeholders or a new delivery need."
  },
  {
   "q": "What should you do after spotting a strong signal?",
   "answer": "Tie it to a customer problem and propose a focused next step, such as a review, a new use case plan or a scoped next phase."
  }
 ]
}</script>

    return '<section><h2>'+label+'</h2><div class="tabs" data-k="'+key+'">'+roles.map(function(r,i){return '<button data-r="'+r+'" class="'+(i?'':'on')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r,i){var b=C.by_role[r][key];return '<div class="pane" data-k="'+key+'" data-r="'+r+'"'+(i?' hidden':'')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')+'</section>'};
  var h='';
  h+='<section><h2>1. Who it is for</h2><p>'+esc(C.who_its_for)+'</p></section>';
  h+='<section><h2>2. Business scenario</h2><p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p></section>';
  h+='<section><h2>3. Before you start</h2>'+(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title})):'<p>No prerequisite.</p>')+(C.prerequisites.length?'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'')+'</section>';
  h+='<section><h2>4. The concept</h2><p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol></section>';
  h+=tabs('say','5. How to say it');
  h+=tabs('show','6. How to show it');
  h+='<section><h2>7. Objections and gotchas</h2>'+C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):'')+'</section>';
  h+='<section><h2>8. Practice</h2><p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table></section>';

  $('c-body').innerHTML=h;

  $('c-side').innerHTML='<div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  $('c-updated').textContent='Last updated '+C.updated;
})();

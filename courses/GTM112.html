<script id="course-data" type="application/json">{
 "id": "GTM112",
 "title": "Expansion signals",
 "path": "Customer Adoption and Expansion",
 "level": "Practitioner",
 "levelId": "L2",
 "minutes": 30,
 "roles": [
  "CSM",
  "PARTNER"
 ],
 "competencies": [
  "Adoption and expansion",
  "Value and ROI"
 ],
 "moments": [
  "Continuous"
 ],
 "assessment": [
  "Knowledge check"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Identify customer behaviors that suggest readiness for broader n8n use and turn them into a simple expansion plan.",
 "who_its_for": "Customer success managers and partners who work with existing n8n customers over time. It assumes the learner already knows the customer's current use case; detailed product training and first-call discovery are out of scope.",
 "scenario": {
  "name": "Pixel & Co.",
  "problem": "An automation agency supports several client accounts on n8n. Some clients have one successful workflow and stop there, while others ask for more use cases, governance and delivery help. The team needs a simple way to spot which accounts are ready for the next conversation."
 },
 "prerequisites": [],
 "concept": "An expansion signal is a customer behavior, request or operating change that suggests they may be ready for broader use of n8n. The point is not to force a sales motion. It is to notice when the customer has more automation demand, more stakeholders, higher standards or more delivery pressure than the current setup covers. Good signals connect to a real next step, such as a new workflow area, a governance discussion, partner services or a review of how the team is building today.",
 "lessons": [
  {
   "title": "What counts as an expansion signal",
   "minutes": 8,
   "summary": "Define the difference between healthy product use, a support issue and a real sign that the account may be ready to grow."
  },
  {
   "title": "Signals from adoption and usage patterns",
   "minutes": 7,
   "summary": "Look for repeated workflow success, more teams getting involved and requests that point beyond the original use case."
  },
  {
   "title": "Signals from delivery and governance needs",
   "minutes": 7,
   "summary": "Spot when scale, reliability, security or handoff questions suggest a broader account conversation."
  },
  {
   "title": "Turn signals into an account plan",
   "minutes": 8,
   "summary": "Prioritize the signal, define the next customer conversation and choose the right follow-up message."
  }
 ],
 "by_role": {
  "CSM": {
   "say": {
    "format": "Customer email",
    "text": "Subject: A quick review of where your automation program could go next. I noticed your team has moved beyond the first workflow and is now involving more users and use cases. If helpful, we can review which patterns usually suggest the next step in adoption, and where teams like yours often add governance, new workflows or delivery support."
   }
  },
  "PARTNER": {
   "say": {
    "format": "Implementation tips",
    "text": "Track signals in the normal delivery process, not as a separate sales task. Note when the client asks for a second workflow in a new team, requests a more repeatable delivery model or starts asking about standards, approvals or ownership. Use those moments to suggest a scoped next phase, not a broad upsell."
   },
   "show": {
    "format": "Lab steps",
    "steps": [
     "Pick one current or fictional client account in your own n8n instance notes or project tracker and list its first delivered workflow.",
     "Add three possible expansion signals for that client, such as demand from another team, requests for more reliable operations or repeated manual handoffs around the workflow.",
     "For each signal, write one next action: customer review, governance workshop, new use case assessment or implementation phase proposal.",
     "Draft a short client summary that links the signal to business impact and a realistic next step.",
     "Check that each signal is based on an observed behavior or request, not a guess about budget or urgency."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "We do not want to push expansion before the customer is ready.",
   "a": "That is correct. A signal is a reason to explore, not to force a pitch. Start with the customer's new need, then decide whether there is a real next step."
  },
  {
   "q": "Most of these signals sound like support or delivery issues, not expansion.",
   "a": "Some are just support issues. They become expansion signals when they repeat, affect more teams or show that the current scope no longer matches the customer's operating reality."
  },
  {
   "q": "We cannot tell if a client wants software growth or more services help.",
   "a": "You do not need to decide too early. Clarify whether the customer needs more use cases, better operating standards or implementation capacity, then route the conversation accordingly."
  }
 ],
 "gotchas": [
  "Do not treat every feature question as an expansion signal.",
  "Do not jump to pricing or packaging before you can name the customer's next problem.",
  "Avoid vague account plans; tie each signal to one clear follow-up action."
 ],
 "practice": {
  "type": "Role-play",
  "brief": "Review a Pixel & Co. client account that has one successful workflow and new requests from two other teams. Explain which signs are true expansion signals, which are not, and propose the next customer conversation.",
  "rubric": [
   {
    "criterion": "Signal quality",
    "good": "Separates observed customer behaviors from guesses and picks signals that suggest a real next need."
   },
   {
    "criterion": "Customer relevance",
    "good": "Connects each signal to the client's workflow maturity, delivery pressure or governance need."
   },
   {
    "criterion": "Next-step clarity",
    "good": "Recommends one practical follow-up action for each signal instead of a vague expansion message."
   },
   {
    "criterion": "Role-appropriate communication",
    "good": "Uses a short customer email or implementation recommendation that is specific, plain and accurate."
   }
  ]
 },
 "check": [
  {
   "q": "What makes something a true expansion signal instead of normal usage?",
   "answer": "It points to a new customer need that the current scope does not fully cover, such as more teams, more workflows, stronger governance or more delivery support."
  },
  {
   "q": "What should a CSM do after spotting an expansion signal?",
   "answer": "Confirm the underlying customer problem and set up a focused follow-up conversation. The next step should match the signal, such as an adoption review or a discussion about broader workflow ownership."
  },
  {
   "q": "How should a partner use expansion signals during delivery?",
   "answer": "Partners should capture them as part of normal project work, then suggest a small and relevant next phase. The recommendation should be tied to observed client needs, not a generic upsell."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

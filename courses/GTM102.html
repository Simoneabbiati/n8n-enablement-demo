<script id="course-data" type="application/json">{
 "id": "GTM102",
 "title": "ICP and personas",
 "path": "GTM Onboarding",
 "level": "Foundation",
 "levelId": "L1",
 "minutes": 45,
 "roles": [
  "AE_MM",
  "AE_ENT",
  "CSM",
  "SE"
 ],
 "competencies": [
  "Discovery",
  "Value and ROI"
 ],
 "moments": [
  "Onboarding (days 0-30)"
 ],
 "assessment": [
  "Knowledge check"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Identify which accounts and buyers are a good fit for n8n, and adapt your first conversation to their goals and constraints.",
 "who_its_for": "New account executives, solutions engineers and customer success managers in their first month. It assumes no prior sales framework knowledge; detailed discovery methods and technical demos are covered in later courses.",
 "scenario": {
  "name": "Meridian Logistics",
  "problem": "A mid-market logistics company uses many SaaS tools for orders, support and internal operations. Teams are stuck with manual handoffs, scattered ownership and a growing backlog of automation requests."
 },
 "prerequisites": [],
 "concept": "An ideal customer profile is the kind of company most likely to get value from n8n, and a persona is the specific buyer or user inside that company. This matters because the same product can sound relevant or irrelevant depending on who you speak to, what problem they own and what constraints they face. In practice, you need to spot the right account shape, find the team that feels the pain most clearly and frame n8n in their language before you go deep on product.",
 "lessons": [
  {
   "title": "What ICP and personas mean here",
   "minutes": 10,
   "summary": "Define account fit versus person fit, and why both matter in the first customer conversation."
  },
  {
   "title": "Signals of a strong fit account",
   "minutes": 12,
   "summary": "Review the company conditions that often create demand for workflow automation, integration and governance."
  },
  {
   "title": "How each buyer sees the problem",
   "minutes": 11,
   "summary": "Compare how operations, engineering and platform stakeholders describe the same pain in different words."
  },
  {
   "title": "When not to pitch n8n first",
   "minutes": 6,
   "summary": "Learn to disqualify weak-fit situations early and avoid forcing a product story where no clear problem exists."
  },
  {
   "title": "Turning fit into a first message",
   "minutes": 6,
   "summary": "Use one short value story, one discovery question and one next step for each role you meet."
  }
 ],
 "by_role": {
  "AE_MM": {
   "say": {
    "format": "Talk track",
    "text": "I look for teams with too many SaaS tools, repeated manual work and an engineering team that cannot keep up with every integration request. My first question is, where does work still move by hand between systems today. I would not pitch n8n first if the prospect has no clear cross-system process problem or if they only need a single point solution."
   }
  },
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "In enterprise accounts, I focus on platform, governance and the cost of fragmented automation across teams. I want to know who owns standards, security review and lifecycle management for integrations and AI use cases [CHECK WITH PRODUCT]. I would not lead with feature detail until I know whether the CTO's main concern is control, risk or build-versus-buy."
   }
  },
  "CSM": {
   "say": {
    "format": "Customer email",
    "text": "Subject: Which teams usually expand workflow automation next. A short note that helps the customer identify the next strong-fit team, such as operations, engineering or a central platform group, and invites them to share where manual cross-system work still exists."
   }
  },
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "Before I demo anything, I test whether the evaluator has a real workflow problem, the right systems in scope and a team that can own delivery. I also listen for limits and prerequisites, such as security review, self-hosting needs or custom logic requirements [CHECK WITH PRODUCT]. If those are unclear, I slow down and qualify before showing a build."
   }
  }
 },
 "objections": [
  {
   "q": "This sounds broad. Who is it actually for in our company?",
   "a": "Start with the team that owns a repeated process across multiple systems and feels the cost of manual work now. Then confirm whether the buyer cares most about speed, control or governance."
  },
  {
   "q": "We can build integrations ourselves.",
   "a": "Many teams can. The fit question is whether they want every workflow request to compete for engineering time, and how they plan to maintain and govern those automations over time."
  },
  {
   "q": "We already have different tools for automation in different teams.",
   "a": "That can work for a while. Ask whether those teams now face duplication, limited visibility or uneven standards, because that is often where a broader workflow platform discussion starts [CHECK WITH PRODUCT]."
  }
 ],
 "gotchas": [
  "Do not treat every operations team as the same buyer; check who owns the process and who approves tooling.",
  "Do not jump into a demo before you know whether the account is mid-market style or enterprise style in its buying process.",
  "Do not assume AI interest means strong fit; confirm there is an underlying workflow and governance need first."
 ],
 "practice": {
  "type": "Role-play",
  "brief": "A colleague plays either an operations leader at Meridian Logistics or a platform leader at Aurora Bank. In five minutes, identify whether the account fits, name the likely persona and give a short value story with one discovery question.",
  "rubric": [
   {
    "criterion": "Identifies account fit clearly",
    "good": "Names concrete signals such as many SaaS tools, manual handoffs, backlog or governance needs."
   },
   {
    "criterion": "Matches message to persona",
    "good": "Uses language that fits the buyer's goals, such as time saved for operations or control and standards for enterprise technology leaders."
   },
   {
    "criterion": "Includes one useful discovery question",
    "good": "Asks a question that reveals process pain, ownership or constraints rather than a generic qualification question."
   },
   {
    "criterion": "Knows when not to push",
    "good": "States one condition where n8n should not be pitched first or where more qualification is needed."
   }
  ]
 },
 "check": [
  {
   "q": "What is the difference between an ICP and a persona?",
   "answer": "The ICP is the kind of company that is a strong fit. The persona is the specific buyer or user inside that company whose goals and pain shape the conversation."
  },
  {
   "q": "What is one strong sign that an account may be a fit for n8n?",
   "answer": "A common sign is repeated manual work across several systems with no clear way to scale automation through engineering alone."
  },
  {
   "q": "Why should you avoid leading with features before you qualify the buyer?",
   "answer": "Because the same product story lands differently with different personas. You need to know their problem, ownership and constraints first so the message is relevant."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

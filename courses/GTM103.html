<script id="course-data" type="application/json">{"id": "GTM103", "title": "Your first workflow", "path": "GTM Onboarding", "level": "Foundation", "levelId": "L1", "minutes": 60, "roles": ["AE_MM", "AE_ENT", "CSM", "SE"], "competencies": ["Technical proficiency"], "moments": ["Onboarding (days 0-30)"], "assessment": ["Hands-on lab", "Automatic grader"], "status": "Example draft, for review", "updated": "2026-10-15", "objective": "Build and explain a simple workflow so you can describe the parts, run it once, and show where business value comes from.", "who_its_for": "New account executives, customer success managers and solutions engineers in their first month. It assumes you have seen the basics in the official prerequisites; deeper node behavior, architecture and security detail are out of scope.", "scenario": {"name": "Meridian Logistics", "problem": "A mid-market logistics company has order and support data spread across many SaaS tools. The operations team keeps copying updates by hand, and simple handoffs are missed when volume rises."}, "prerequisites": [{"code": "QS101", "title": "n8n Quickstart", "url": "https://learn.n8n.io/courses/course-v1:n8n+QS101+2026H2/about"}, {"code": "N8N101", "title": "Essentials: Your First Workflows", "url": "https://learn.n8n.io/courses/course-v1:n8n+N8N101+2026H2/about"}], "concept": "A first workflow is the shortest useful example of how work moves through n8n. It starts with a trigger, passes data through one or more nodes, and ends with an action in another system or message channel. The point is not to build something complex. The point is to see the flow, understand what each step does, and connect the automation to a real business problem such as manual updates, slow handoffs or repeated admin work.", "lessons": [{"title": "Pick one small business problem", "minutes": 12, "summary": "Choose a narrow use case that is easy to explain and ties to obvious manual work."}, {"title": "Build the workflow shape", "minutes": 16, "summary": "Add a trigger, connect the next nodes, and understand the path data will follow."}, {"title": "Run it and inspect the data", "minutes": 12, "summary": "Test the workflow once and check what entered, changed and left each step."}, {"title": "Handle simple changes", "minutes": 10, "summary": "Make one small edit, such as changing a field or adding a branch, without losing the story."}, {"title": "Explain the workflow to a customer", "minutes": 10, "summary": "Translate the build into plain language for operations, engineering and executive audiences."}], "by_role": {"AE_MM": {"say": {"format": "Talk track", "text": "A first workflow is the easiest way to make the value concrete. Instead of talking about automation in the abstract, show one manual step at Meridian Logistics and how it becomes a repeatable workflow. Discovery question: where does your team still copy data between tools by hand. Do not pitch this if the customer has not named a repeated process or if the pain is only about reporting, not action."}}, "AE_ENT": {"say": {"format": "Talk track", "text": "For enterprise buyers, the first workflow is not about a toy example. It is a small proof that a platform team can standardize repeated automations and make the logic visible to more than one engineer. Frame it as a starting point for operational control, with governance and deployment questions handled separately in later conversations."}, "show": {"format": "Demo steps", "steps": ["Open a simple workflow that starts from a basic trigger and label the business event it represents.", "Walk through each node and tie it to one operational handoff, such as creating or updating a record and sending a team notification.", "Run the workflow once and inspect the execution data so the customer sees what changed and where.", "Show one small edit, such as mapping a different field or adding a simple decision point, to prove the workflow can be adapted without rewriting everything."]}}, "CSM": {"say": {"format": "Customer email", "text": "Subject: A practical first workflow for your team. I am reaching out because teams with manual handoffs across several tools often benefit from starting with one small workflow that is easy to test and explain. If that matches your current setup, I can share a simple adoption plan and help your automation owner choose a good first use case."}}, "SE": {"say": {"format": "Talk track", "text": "Keep the first workflow narrow and inspectable. Show the trigger, the data moving through the nodes, and the final action, then be clear about what is mocked, what needs credentials, and what you are not covering yet. If possible, use an example workflow you can import and adapt live [CHECK WITH PRODUCT]."}, "show": {"format": "Demo steps", "steps": ["Create a new workflow in your n8n instance and add a simple trigger.", "Add one or two downstream nodes that represent a realistic handoff between systems or teams.", "Map at least one field from the trigger into the next step and explain why that field matters.", "Execute the workflow and inspect the output at each node.", "Make one safe change live, then run it again to show the workflow is understandable and editable."]}}}, "objections": [{"q": "This looks basic. Why should we care about one small workflow?", "a": "Because the first workflow is not the end state. It proves the team can model a real process, test it, and change it without starting from scratch."}, {"q": "Our engineers can script a simple handoff faster than building this.", "a": "Sometimes they can. The value here is that the logic is easier to review, test and hand over to the rest of the team, not just the original builder."}, {"q": "We do not know the right use case to start with.", "a": "Start with a repeated task that crosses tools and has a clear owner. Avoid broad transformation projects for the first workflow."}], "gotchas": ["Do not choose a first example that needs too many credentials, approvals or custom logic.", "Do not rush past execution data; customers often understand the product only when they see input and output clearly.", "If a step is simulated, say so plainly instead of implying it is a production-ready pattern."], "practice": {"type": "Hands-on lab", "brief": "In your own n8n instance, build a simple workflow that starts with a trigger, passes data to at least one additional node, and completes one clear action. Use a small business scenario inspired by Meridian Logistics and be ready to explain what problem the workflow solves.", "rubric": [{"criterion": "Workflow structure is complete", "good": "The grader finds a trigger node, at least one connected downstream node, and one successful execution path."}, {"criterion": "Data is mapped through the workflow", "good": "The grader finds that at least one field from an earlier step is used in a later step, rather than every value being hard-coded."}, {"criterion": "Workflow runs successfully", "good": "The grader finds a successful test execution in the learner's instance and confirms the workflow does not stop at the trigger."}, {"criterion": "Use case is explained clearly", "good": "The learner can state the trigger, action and business problem in plain language in under one minute."}]}, "check": [{"q": "What makes a good first workflow for a new learner?", "answer": "It solves one small repeated problem, is easy to test, and does not depend on many complex prerequisites or approvals."}, {"q": "Why should you inspect execution data after running a workflow?", "answer": "It shows what entered and left each step, which helps you explain the logic, verify mappings and spot mistakes quickly."}, {"q": "How should you position a first workflow in a customer conversation?", "answer": "As a concrete example of one manual handoff becoming repeatable and visible, not as the full architecture or final production design."}]}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

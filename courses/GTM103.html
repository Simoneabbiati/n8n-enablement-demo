<script id="course-data" type="application/json">{
 "id": "GTM103",
 "title": "Your first workflow",
 "path": "GTM Onboarding",
 "level": "Foundation",
 "levelId": "L1",
 "minutes": 60,
 "roles": [
  "AE_MM",
  "AE_ENT",
  "CSM",
  "SE"
 ],
 "competencies": [
  "Technical proficiency"
 ],
 "moments": [
  "Onboarding (days 0-30)"
 ],
 "assessment": [
  "Hands-on lab",
  "Automatic grader"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Build and explain a simple workflow so you can describe how n8n works from trigger to result.",
 "who_its_for": "New account executives, customer success managers and solutions engineers in their first month. It assumes you have seen the product once already; detailed architecture, security review and advanced AI topics are out of scope.",
 "scenario": {
  "name": "Meridian Logistics",
  "problem": "A mid-market logistics company moves order and support data between many SaaS tools by hand. The team needs a first automation that is simple to build, easy to explain and useful enough to discuss in customer conversations."
 },
 "prerequisites": [
  {
   "code": "QS101",
   "title": "n8n Quickstart",
   "url": "https://learn.n8n.io/courses/course-v1:n8n+QS101+2026H2/about"
  },
  {
   "code": "N8N101",
   "title": "Essentials: Your First Workflows",
   "url": "https://learn.n8n.io/courses/course-v1:n8n+N8N101+2026H2/about"
  }
 ],
 "concept": "A first workflow is the smallest useful automation you can build and explain clearly. It starts with one trigger, moves data through a few nodes, and ends with one visible outcome. The goal is not to cover every feature. The goal is to show how a real business step can move from manual work to a repeatable workflow, and where a team would extend it later.",
 "lessons": [
  {
   "title": "Choose a simple use case",
   "minutes": 12,
   "summary": "Pick one manual step that has a clear trigger, a few fields of data and one useful result."
  },
  {
   "title": "Build the flow from trigger to action",
   "minutes": 18,
   "summary": "Create a basic workflow with a trigger, one or two processing steps and an action in another tool."
  },
  {
   "title": "Test, inspect and fix errors",
   "minutes": 12,
   "summary": "Run the workflow, inspect the data at each step and correct common setup mistakes."
  },
  {
   "title": "Explain the workflow to a customer",
   "minutes": 10,
   "summary": "Translate the build into plain business language for technical and non-technical audiences."
  },
  {
   "title": "Prepare for a first live demo",
   "minutes": 8,
   "summary": "Set up a safe path through the workflow and avoid the most common live-demo failures."
  }
 ],
 "by_role": {
  "AE_MM": {
   "say": {
    "format": "Talk track",
    "text": "A first workflow is a simple way to show where your team loses time today and how that step can become repeatable. One good discovery question is, which process still depends on someone copying data between two tools every day. Do not pitch this if the customer has not named a real manual step or if the issue is only reporting with no workflow action behind it."
   }
  },
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "The business case for a first workflow is not the single task by itself. It is proving that one governed automation pattern can be repeated across teams, with the right controls and deployment model [CHECK WITH PRODUCT]. Expect the CTO to ask where the workflow runs, how it connects to internal systems and who maintains it over time."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Open a simple workflow that starts from a form or webhook trigger.",
     "Show the incoming data and explain which fields matter to the business process.",
     "Run one processing step and one destination step so the audience can see the path from input to output.",
     "Point out where credentials, approvals or hosting choices would matter in an enterprise setup [CHECK WITH PRODUCT]."
    ]
   }
  },
  "CSM": {
   "say": {
    "format": "Customer email",
    "text": "Subject: A simple workflow your team can build this week. Share one practical starter use case, suggest a short working session to build it in their own instance, and note that accounts with manual cross-tool handoffs are the best fit for this adoption step."
   }
  },
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "Keep the first workflow small enough to understand in one screen. Explain the trigger, the data shape, the transformation and the final action, then note any prerequisites such as credentials, reachable endpoints or sample data. If a customer asks about scale or governance, answer at a high level and move deeper only if the evaluation needs it."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Create a new workflow and add a simple trigger such as a form, schedule or webhook.",
     "Add one node that changes, maps or checks the incoming data.",
     "Add one action node that sends the result to another system or channel.",
     "Execute the workflow and inspect the data output at each node.",
     "Save the workflow and explain how you would adapt it to the customer's tools."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "This looks basic. Why should we care about one small workflow?",
   "a": "The first workflow is a proof of approach. It shows how your team would connect systems, handle data and maintain an automation before you invest in larger use cases."
  },
  {
   "q": "Our team can already script this.",
   "a": "That may be true. The question is whether the result is easy for others to inspect, change and run as business needs change."
  },
  {
   "q": "We do not want to spend time learning a new tool for a tiny process.",
   "a": "Start with a process that is frequent, visible and low risk. If that first use case is not useful, it is too early to broaden the rollout."
  }
 ],
 "gotchas": [
  "Do not build with unclear sample data; missing or messy fields cause confusion later in the flow.",
  "Check credentials and permissions before a live session, especially on destination systems.",
  "Avoid adding too many branches or edge cases in the first demo; keep the path easy to follow."
 ],
 "practice": {
  "type": "Hands-on lab",
  "brief": "In your own n8n instance, build a simple workflow for Meridian Logistics that starts from one trigger, processes the data in at least one intermediate step and finishes with one action. Be ready to explain what each node does and why this is a good first workflow.",
  "rubric": [
   {
    "criterion": "Workflow structure",
    "good": "The grader finds one valid trigger, at least one intermediate processing node and one final action node connected in the correct order."
   },
   {
    "criterion": "Successful execution",
    "good": "The grader confirms the workflow runs and produces output data at the final step without manual repair during grading."
   },
   {
    "criterion": "Data handling",
    "good": "The grader detects that input fields are passed or transformed in a way that matches the intended business step."
   },
   {
    "criterion": "Clarity of design",
    "good": "Node names or structure make the flow understandable, and the learner can explain the business purpose in plain words."
   }
  ]
 },
 "check": [
  {
   "q": "What makes a workflow a good first workflow for training or a first customer discussion?",
   "answer": "It should solve one real manual step, be easy to follow from trigger to outcome and avoid unnecessary complexity."
  },
  {
   "q": "Why is testing each node important before a live demo?",
   "answer": "It helps you confirm that the data is arriving in the expected shape and that each step works before you show it to a customer."
  },
  {
   "q": "How should you explain a first workflow to a non-technical buyer?",
   "answer": "Start with the manual process, name the trigger and the result, and avoid deep product detail unless they ask for it."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>
</body>

<script id="course-data" type="application/json">{
 "id": "GTM108",
 "title": "The standard demo",
 "path": "Discovery and Demo Certification",
 "level": "Practitioner",
 "levelId": "L2",
 "minutes": 60,
 "roles": [
  "AE_MM",
  "AE_ENT",
  "SE"
 ],
 "competencies": [
  "Demo"
 ],
 "moments": [
  "Ramp (days 31-90)"
 ],
 "assessment": [
  "Certification"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Deliver a clear, repeatable n8n demo that starts from the customer's problem, shows one workflow end to end, and handles common questions honestly.",
 "who_its_for": "Account executives and solutions engineers who already know the basics of workflows and now need a repeatable customer demo. It assumes you can explain triggers, nodes and workflow logic; deep security review and custom proof work are out of scope.",
 "scenario": {
  "name": "Meridian Logistics",
  "problem": "A mid-market logistics company runs order updates, support requests and internal alerts across many SaaS tools. Teams copy data by hand between systems, engineering is overloaded, and leaders want one practical example before they agree to a deeper evaluation."
 },
 "prerequisites": [
  {
   "code": "N8N101",
   "title": "Essentials: Your First Workflows",
   "url": "https://learn.n8n.io/courses/course-v1:n8n+N8N101+2026H2/about"
  }
 ],
 "concept": "A standard demo is the default story you can tell in a first or second customer meeting. It is not a tour of every feature. It is one short workflow, built around a problem the customer already admits they have, with just enough detail to show how n8n works and where it fits. The goal is to make the customer think, \"this looks like our process,\" not to prove every edge case live.",
 "lessons": [
  {
   "title": "Frame the problem before the product",
   "minutes": 12,
   "summary": "Set up the demo with the customer's current process, the cost of manual work and the one outcome you will show."
  },
  {
   "title": "Walk the workflow end to end",
   "minutes": 16,
   "summary": "Show a simple trigger, a few nodes, the data moving through them and the business result at the end."
  },
  {
   "title": "Explain choices, limits and next steps",
   "minutes": 12,
   "summary": "Translate what the customer sees into how teams build, change and govern workflows, without over-claiming."
  },
  {
   "title": "Handle interruptions and objections live",
   "minutes": 10,
   "summary": "Answer common pushback, keep control of the flow and avoid getting trapped in side paths."
  },
  {
   "title": "Certification role-play",
   "minutes": 10,
   "summary": "Practise the standard demo with a peer who plays the customer and asks realistic questions."
  }
 ],
 "by_role": {
  "AE_MM": {
   "say": {
    "format": "Talk track",
    "text": "Let me show one process your team is doing by hand today: an order issue comes in, data is checked across systems, then the right people are notified. I will keep this to one workflow so you can judge whether n8n fits the way your team already works. If your main problem is not cross-system process work, this may not be the right demo to spend time on."
   }
  },
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "I will show a simple workflow first, then explain what it means for control, review and maintainability. The point is not just that the process can be automated, but that your platform team can manage how these automations are built and changed over time [CHECK WITH PRODUCT]. If your evaluation is already at detailed security review stage, this standard demo should be followed by a deeper technical session."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Open the prepared workflow and state the business process in one sentence before clicking anything.",
     "Show the trigger and the connected systems, then explain why this workflow exists in the first place.",
     "Run the workflow once and pause at each major step to show the data path and any decision logic.",
     "Show the final outcome, such as an update in another system and a team notification.",
     "Close by summarising what a platform or engineering team would need to review next, including hosting, access and governance topics [CHECK WITH PRODUCT]."
    ]
   }
  },
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "I narrate the workflow in the same order the data moves. I explain what is standard, what is configurable and where custom logic might be needed. If a customer asks about a limit or a connector I have not verified, I say I will check rather than guessing."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Start with a prepared workflow for Meridian Logistics that covers one operational process from trigger to action.",
     "Open the trigger node and explain what event starts the workflow and what sample data is coming in.",
     "Step through the key nodes, showing transformations, routing or decision points one by one.",
     "Execute the workflow and inspect the output so the customer can see what changed at each stage.",
     "Point out where a team could add code or another node if their process is more complex.",
     "End with the outcome in the destination system and a short recap of prerequisites, limits and likely next steps."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "This looks like a canned demo. How do I know it applies to us?",
   "a": "That is fair. The purpose of the standard demo is to confirm the pattern fits your process. If it does, the next step is to map one of your real workflows in more detail."
  },
  {
   "q": "Our engineers could build this themselves.",
   "a": "They might. The question is how quickly they can deliver it, who changes it later and how visible that process is to the rest of the team."
  },
  {
   "q": "Can you show our exact systems right now?",
   "a": "Only if they are prepared and verified in advance. In a first demo, it is better to show a proven flow clearly than improvise and create confusion."
  }
 ],
 "gotchas": [
  "Do not start in the product UI before you state the customer problem and what the workflow will prove.",
  "Do not click into too many side settings; keep the flow visible and stay with the main narrative.",
  "Do not promise that a connector, hosting option or governance control exists unless you have checked it [CHECK WITH PRODUCT]."
 ],
 "practice": {
  "type": "Role-play",
  "brief": "Run a 10-minute standard demo for Meridian Logistics. One learner plays the seller and one plays an operations or engineering stakeholder who interrupts twice: once with a relevance question and once with a build-versus-buy objection.",
  "rubric": [
   {
    "criterion": "Starts from the customer's problem",
    "good": "Frames the workflow in business terms before opening the product and states the outcome the demo will show."
   },
   {
    "criterion": "Shows a clear end-to-end flow",
    "good": "Walks through the trigger, key nodes and final result in a logical order without getting lost in side details."
   },
   {
    "criterion": "Handles objections honestly",
    "good": "Answers questions directly, avoids unsupported claims and parks deep topics for follow-up when needed."
   },
   {
    "criterion": "Ends with a next step",
    "good": "Confirms fit or lack of fit and proposes a sensible follow-up, such as discovery on a real workflow or a deeper technical session."
   }
  ]
 },
 "check": [
  {
   "q": "What is the purpose of a standard demo in an early customer meeting?",
   "answer": "It shows one realistic workflow clearly enough for the customer to judge fit. It is meant to confirm a problem pattern, not to cover every feature or edge case."
  },
  {
   "q": "What should you do if a customer asks for a capability you have not verified?",
   "answer": "Say you will check and follow up. It is better to be accurate than to guess in a live demo."
  },
  {
   "q": "What makes a standard demo effective?",
   "answer": "It starts from the customer's problem, shows one end-to-end workflow, and ends with a clear next step based on what the customer cares about."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>
</body>

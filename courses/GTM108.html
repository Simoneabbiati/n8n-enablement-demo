<script id="course-data" type="application/json">{"id": "GTM108", "title": "The standard demo", "path": "Discovery and Demo Certification", "level": "Practitioner", "levelId": "L2", "minutes": 60, "roles": ["AE_MM", "AE_ENT", "SE"], "competencies": ["Demo"], "moments": ["Ramp (days 31-90)"], "assessment": ["Certification"], "status": "Example draft, for review", "updated": "2026-10-15", "objective": "Deliver a standard n8n demo that links the workflow to a customer problem, explains what is happening, and handles common questions without over-claiming.", "who_its_for": "Account executives and solutions engineers who already know the basic product shape and now need a repeatable demo. It assumes you can describe a workflow at a high level; deep security review and custom proof design are out of scope.", "scenario": {"name": "Meridian Logistics", "problem": "A mid-market logistics company uses many SaaS tools for orders, support and internal updates. Teams copy data by hand between systems, and engineering cannot keep up with every integration request."}, "prerequisites": [{"code": "N8N101", "title": "Essentials: Your First Workflows", "url": "https://learn.n8n.io/courses/course-v1:n8n+N8N101+2026H2/about"}], "concept": "A standard demo is a short, repeatable way to show how n8n solves a common automation problem. It is not a full product tour. You start with the customer's manual process, show one workflow end to end, explain just enough of triggers, nodes and data flow, and stop before you drift into features that do not matter. The goal is to make the buyer see their own process in the example and know what to ask next.", "lessons": [{"title": "Set up the story before the screen share", "minutes": 12, "summary": "Frame the manual problem, the systems involved and the result the customer wants before opening the product."}, {"title": "Run the core workflow demo", "minutes": 18, "summary": "Show a simple trigger, the steps in the workflow and the result in the destination tools."}, {"title": "Explain what matters and skip what does not", "minutes": 10, "summary": "Use plain language to explain the workflow while avoiding side paths that distract from the main value."}, {"title": "Handle common questions live", "minutes": 10, "summary": "Answer pushback on fit, complexity and AI carefully, without inventing details."}, {"title": "Close the demo and earn the next step", "minutes": 10, "summary": "Summarise what the workflow solved, confirm fit and ask for the right follow-up action."}], "by_role": {"AE_MM": {"say": {"format": "Talk track", "text": "Let me show one workflow that maps to the manual work you described. Meridian's team receives new order or support data, routes it across tools, and updates the right people without copy-paste. If the pain is not repeated manual work across systems, I would not lead with this demo."}}, "AE_ENT": {"say": {"format": "Talk track", "text": "I will keep this demo focused on the operating model, not just the UI. The point is to show how a platform team can standardise automation work across systems while keeping technical control and governance in view [CHECK WITH PRODUCT]. If the buyer only wants a point solution for one narrow task, this standard demo may be too broad."}, "show": {"format": "Demo steps", "steps": ["Start with the workflow already open and name the business process being automated.", "Show the trigger and the systems touched by the workflow, then explain why each step exists.", "Run the workflow once and follow the data through the path that matters most.", "Point out where a technical team would review logic, approvals or deployment choices [CHECK WITH PRODUCT].", "End on the business outcome and the questions needed for a deeper technical review."]}}, "SE": {"say": {"format": "Talk track", "text": "I narrate the demo from left to right: trigger, transformation, action and result. I keep the example realistic, explain any prerequisites before I run it, and say clearly when a question needs product confirmation. If the customer asks for edge cases, I note them and decide whether to branch or park them."}, "show": {"format": "Demo steps", "steps": ["Open a prepared workflow for Meridian Logistics that starts from a new request or scheduled event.", "Walk through the nodes in order and state what data enters, changes and leaves at each step.", "Execute the workflow and show the output in the target system or message destination.", "Open one node in detail to show that the workflow can be adjusted without rebuilding the whole flow.", "If relevant to the audience, show a small AI step in the flow and label it as one part of the process, not the whole story [CHECK WITH PRODUCT].", "Finish by showing where you would duplicate or extend the workflow for a second use case."]}}}, "objections": [{"q": "This looks like a canned demo. How do I know it fits our process?", "a": "That is fair. The standard demo is meant to prove the model: trigger, logic and actions across systems. The next step is to map one of your real workflows against that pattern."}, {"q": "Our team could build this ourselves with scripts.", "a": "You may be able to. The demo is meant to show a maintainable workflow that technical teams can review and change over time, rather than only proving that automation is possible."}, {"q": "Where does AI fit here?", "a": "Only show AI if it supports the process you are already discussing. If AI is not part of the problem, keep the demo focused on workflow orchestration and add AI later if needed."}], "gotchas": ["Do not start with the canvas before stating the business problem and the systems involved.", "Do not improvise on integrations, deployment options or governance details you have not confirmed [CHECK WITH PRODUCT].", "Do not let one technical side question consume the whole demo; park it and return to the main flow."], "practice": {"type": "Role-play", "brief": "Run a 10-minute standard demo for Meridian Logistics. One learner plays the seller and one plays the customer. The seller must frame the problem, show one workflow, answer two questions and close with a next step.", "rubric": [{"criterion": "Problem-first setup", "good": "Starts with Meridian's manual cross-system work and the desired outcome before opening the workflow."}, {"criterion": "Clear demo flow", "good": "Shows the workflow in a logical order, explains trigger and actions in plain language, and avoids unnecessary detours."}, {"criterion": "Honest handling of questions", "good": "Answers common objections directly and flags uncertain claims for follow-up instead of guessing."}, {"criterion": "Strong close", "good": "Ends by linking the demo to the customer's process and asks for a specific next step."}]}, "check": [{"q": "What is the main purpose of a standard demo?", "answer": "To show one repeatable workflow that makes the customer's problem concrete. It should help the buyer see how their own process could map to the product."}, {"q": "When should you avoid adding extra product features during the demo?", "answer": "When those features do not help explain the workflow or solve the customer's stated problem. Extra detail can distract from the value and create confusion."}, {"q": "How should you respond if a customer asks for a product detail you are not sure about?", "answer": "Say you need to confirm it and follow up after the call. It is better to be accurate than to guess in a live demo."}]}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>

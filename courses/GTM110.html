<script id="course-data" type="application/json">{
 "id": "GTM110",
 "title": "Workflows as software",
 "path": "Enterprise Selling",
 "level": "Expert",
 "levelId": "L3",
 "minutes": 60,
 "roles": [
  "AE_ENT",
  "SE"
 ],
 "competencies": [
  "Technical proficiency",
  "Objection handling"
 ],
 "moments": [
  "Ramp (days 31-90)",
  "Launch readiness"
 ],
 "assessment": [
  "Hands-on lab",
  "Automatic grader"
 ],
 "status": "Example draft, for review",
 "updated": "2026-10-15",
 "objective": "Explain how to position workflows as software that teams design, test, review and operate with engineering discipline.",
 "who_its_for": "Enterprise account executives and solutions engineers preparing for technical evaluations and architecture discussions. This assumes the learner already understands basic workflows and AI use cases; it does not cover entry-level product positioning.",
 "scenario": {
  "name": "Aurora Bank",
  "problem": "A regulated enterprise wants AI agents for internal operations, but its architects reject fragile automations that cannot be tested, reviewed and managed like software. The bank will only consider a self-hosted approach and expects clear answers on reliability, change control and team ownership."
 },
 "prerequisites": [
  {
   "code": "N8N103",
   "title": "In Practice: AI, Testing & Best Practices",
   "url": "https://learn.n8n.io/courses/course-v1:n8n+N8N103+2026H2/about"
  }
 ],
 "concept": "Workflows as software means treating automations as part of the production system, not as one-off helpers. The team designs them with clear inputs and outputs, tests expected behavior, reviews changes, handles failures and assigns ownership. In enterprise deals, this matters because buyers are not only asking whether a workflow can run today; they are asking whether their platform team can trust it, maintain it and govern it over time.",
 "lessons": [
  {
   "title": "Why enterprises reject fragile automation",
   "minutes": 12,
   "summary": "What technical buyers mean by brittle workflows, and why that blocks adoption in regulated environments."
  },
  {
   "title": "What makes a workflow behave like software",
   "minutes": 16,
   "summary": "Inputs, outputs, modular design, error handling, testing and ownership in plain terms."
  },
  {
   "title": "How to position this to a CTO and platform team",
   "minutes": 12,
   "summary": "Tie workflow discipline to governance, maintainability and the build-versus-buy discussion."
  },
  {
   "title": "Demo and lab: reviewable, testable workflow design",
   "minutes": 12,
   "summary": "Show a workflow with clear paths, controlled failure handling and a simple validation approach."
  },
  {
   "title": "Handling objections and setting limits honestly",
   "minutes": 8,
   "summary": "Answer common pushback without overstating maturity, coverage or operational guarantees."
  }
 ],
 "by_role": {
  "AE_ENT": {
   "say": {
    "format": "Talk track",
    "text": "If your concern is not just automation, but whether automation can be run safely at enterprise scale, frame workflows as software. The value is that your platform team can apply engineering discipline to business processes instead of leaving critical logic in scripts, tickets and tribal knowledge. Ask one discovery question: which automations today are too important to stay as ad hoc scripts or manual runbooks. Do not pitch this if the buyer only needs a quick team-level task automation and has no platform, governance or reliability concern."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Open a workflow that has a clear trigger, named steps and separate paths for success and failure.",
     "Show where input data is validated before downstream actions run.",
     "Run a success case first, then trigger a controlled failure and show how the workflow handles it.",
     "Point out where a team would review, update and own this workflow over time."
    ]
   }
  },
  "SE": {
   "say": {
    "format": "Talk track",
    "text": "Position the workflow as an operational system with defined behavior, not as a canvas full of nodes. Explain the prerequisites, such as agreed inputs, access to the required systems and a plan for testing and ownership. Be clear on limits: a workflow still needs sound design, and enterprise readiness depends on the surrounding operating model too [CHECK WITH PRODUCT]."
   },
   "show": {
    "format": "Demo steps",
    "steps": [
     "Import or open an example workflow for an internal approval or triage process.",
     "Walk through the trigger, data mapping and each decision point so the evaluator can see the logic.",
     "Show one test run with valid input and confirm the expected output.",
     "Show a second run with missing or bad input and explain the error path or fallback behavior.",
     "Finish by showing how the workflow could be updated in a controlled way without rewriting the whole process."
    ]
   }
  }
 },
 "objections": [
  {
   "q": "This still sounds like automation, not software.",
   "a": "Agree that a workflow is not the same thing as a full application. The point is that important automations can still be designed, tested and managed with software-like discipline instead of being treated as disposable tasks."
  },
  {
   "q": "We can build this ourselves with scripts and internal services.",
   "a": "You may be able to. The decision usually comes down to visibility, speed of change, shared ownership and how much custom engineering capacity you want tied up in process orchestration."
  },
  {
   "q": "If AI is involved, how can we trust the outcome?",
   "a": "Separate deterministic workflow steps from model-driven steps, and show where validation or human review belongs. Do not present AI outputs as guaranteed facts."
  }
 ],
 "gotchas": [
  "Do not call every workflow production-ready; show the design choices that make one safer to operate.",
  "Do not blur together workflow logic, hosting model and governance controls if you have not confirmed the exact product capabilities [CHECK WITH PRODUCT].",
  "In a live demo, test the failure path before the call so the example does not fail in an uncontrolled way."
 ],
 "practice": {
  "type": "Hands-on lab",
  "brief": "Build a workflow in your own n8n instance that accepts structured input, branches on a simple rule, returns a success result for valid input and a controlled error result for invalid input. The workflow should be understandable to another operator without verbal explanation.",
  "rubric": [
   {
    "criterion": "Clear structure",
    "good": "The grader can detect a trigger, at least one decision step and distinct end behavior for valid and invalid input."
   },
   {
    "criterion": "Controlled handling of bad input",
    "good": "The grader can send invalid input and confirm the workflow returns or records a predictable error outcome instead of stopping unclearly."
   },
   {
    "criterion": "Testable behavior",
    "good": "The grader can run at least one valid and one invalid test case and observe different expected results."
   },
   {
    "criterion": "Readable design",
    "good": "Node names and path structure make the purpose of the workflow understandable without extra notes."
   }
  ]
 },
 "check": [
  {
   "q": "What does it mean to treat workflows as software?",
   "answer": "It means designing and operating important automations with defined behavior, testing, change review and clear ownership instead of treating them as throwaway helpers."
  },
  {
   "q": "Why does this matter in enterprise deals?",
   "answer": "Enterprise buyers care about maintainability, governance and operational risk. They need to know a workflow can be trusted and managed over time, not just built once."
  },
  {
   "q": "When should an AE avoid leading with this message?",
   "answer": "Avoid it when the buyer only has a small, isolated automation need and is not concerned with platform standards, governance or long-term operational ownership."
  }
 ]
}</script>
<script>
(function(){
  var C=JSON.parse(document.getElementById('course-data').textContent);
  var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/\[CHECK WITH PRODUCT\]/g,'<span class="check">[check with product]</span>')};
  var ROLE={AE_MM:'Account Executive (mid-market)',AE_ENT:'Account Executive (enterprise)',SE:'Solutions Engineer',CSM:'Customer Success Manager',PARTNER:'Partner / implementation consultant'};
  var $=function(s){return document.getElementById(s)};
  var pref=store.get('gtm-academy-role','');
  document.title=C.title+' — GTM Academy (concept)';
  $('c-path').textContent=C.path; $('c-code').textContent=C.id+' · '+C.level; $('c-title').textContent=C.title; $('c-objective').textContent=C.objective;
  $('c-facts').innerHTML=['<span><b>'+C.minutes+' min</b></span>','<span>'+C.lessons.length+' lessons</span>','<span>For: '+esc(C.roles.map(function(r){return ROLE[r]||r}).join(', '))+'</span>','<span>When: '+esc(C.moments.join(', '))+'</span>'].join('');
  var ul=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
  var S=[];
  var sec=function(id,title,html){if(!html)return '';S.push([id,title]);return '<section id="'+id+'"><h2>'+title+'</h2>'+html+'</section>'};
  var tabs=function(key){var roles=C.roles.filter(function(r){return C.by_role[r]&&C.by_role[r][key]});if(!roles.length)return '';
    var first=roles.indexOf(pref)>-1?pref:roles[0];
    return '<div class="tabs" role="tablist" data-k="'+key+'">'+roles.map(function(r){return '<button role="tab" aria-selected="'+(r===first)+'" data-r="'+r+'" class="'+(r===first?'on':'')+'">'+esc(ROLE[r]||r)+'</button>'}).join('')+'</div>'+
      roles.map(function(r){var b=C.by_role[r][key];return '<div class="pane" role="tabpanel" data-k="'+key+'" data-r="'+r+'"'+(r===first?'':' hidden')+'><p><b>'+esc(b.format)+'</b></p>'+(b.steps?'<ol>'+b.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+(b.text?'<p>'+esc(b.text)+'</p>':'')+'</div>'}).join('')};
  var h='';
  h+=sec('who','Who it is for','<p>'+esc(C.who_its_for)+'</p>');
  h+=sec('scenario','Business scenario','<p><b>'+esc(C.scenario.name)+'.</b> '+esc(C.scenario.problem)+'</p>');
  h+=sec('before','Before you start',(C.prerequisites.length?ul(C.prerequisites.map(function(p){return p.code+' '+p.title}))+'<p>'+C.prerequisites.map(function(p){return '<a href="'+p.url+'" target="_blank" rel="noopener">Open '+esc(p.code)+' on learn.n8n.io</a>'}).join(' · ')+'</p>':'<p>No prerequisite.</p>'));
  h+=sec('concept','The concept','<p>'+esc(C.concept)+'</p><h3>Lessons</h3><ol>'+C.lessons.map(function(l){return '<li><b>'+esc(l.title)+'</b> ('+l.minutes+' min). '+esc(l.summary)+'</li>'}).join('')+'</ol>');
  h+=sec('say','How to say it',tabs('say'));
  h+=sec('show','How to show it',tabs('show'));
  h+=sec('objections','Objections and gotchas',C.objections.map(function(o){return '<details class="q"><summary>'+esc(o.q)+'</summary><p>'+esc(o.a)+'</p></details>'}).join('')+(C.gotchas&&C.gotchas.length?ul(C.gotchas):''));
  h+=sec('practice','Practice','<p><b>'+esc(C.practice.type)+'.</b> '+esc(C.practice.brief)+'</p><table class="t"><thead><tr><th>Criterion</th><th>What good looks like</th></tr></thead><tbody>'+C.practice.rubric.map(function(r){return '<tr><td>'+esc(r.criterion)+'</td><td>'+esc(r.good)+'</td></tr>'}).join('')+'</tbody></table>');
  h+=sec('check','Check your understanding',C.check.map(function(q,i){return '<details class="q"><summary>'+(i+1)+'. '+esc(q.q)+'</summary><p>'+esc(q.answer)+'</p></details>'}).join(''));
  h+='<nav class="pager" id="pager" aria-label="Course navigation"></nav>';
  $('c-body').innerHTML=h;
  /* tabs */
  document.querySelectorAll('.tabs').forEach(function(t){t.querySelectorAll('button').forEach(function(b){b.onclick=function(){var k=t.dataset.k;
    t.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
    document.querySelectorAll('.pane[data-k="'+k+'"]').forEach(function(p){p.hidden=p.dataset.r!==b.dataset.r})}})});
  /* side */
  var done=new Set(store.get('gtm-academy-done',[]));
  $('c-side').innerHTML='<div class="box"><button class="complete" id="complete"></button></div><div class="box toc"><h4>On this page</h4>'+S.map(function(s,i){return '<a href="#'+s[0]+'" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</a>'}).join('')+'</div><div class="box"><h4>Builds</h4>'+ul(C.competencies)+'</div><div class="box"><h4>Assessment</h4>'+ul(C.assessment)+'</div><div class="box"><h4>Status</h4><p style="margin:0;color:var(--soft)">'+esc(C.status)+'</p></div>';
  var btn=$('complete');
  var paint=function(){var d=done.has(C.id);btn.textContent=d?'Completed ✓ (undo)':'Mark as completed';btn.classList.toggle('done',d)};
  btn.onclick=function(){done.has(C.id)?done.delete(C.id):done.add(C.id);store.set('gtm-academy-done',Array.from(done));paint()};paint();
  /* scrollspy + read bar */
  var links=document.querySelectorAll('.toc a');
  var onScroll=function(){var y=window.scrollY+120,cur=S[0][0];S.forEach(function(s){var el=document.getElementById(s[0]);if(el&&el.offsetTop<=y)cur=s[0]});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.s===cur)});
    var max=document.documentElement.scrollHeight-window.innerHeight;$('readbar').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  /* pager: read the live catalog */
  fetch('../index.html').then(function(r){return r.text()}).then(function(t){
    var m=t.match(/<script id="academy-data" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return;
    var D=JSON.parse(m[1]),ids=D.courses.map(function(c){return c.id}),i=ids.indexOf(C.id),pages=new Set(D.pages||[]);
    var link=function(c,lab,al){if(!c)return '<span></span>';return pages.has(c.id)?'<a href="'+c.id+'.html" style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+'</a>':'<span style="text-align:'+al+'"><span>'+lab+'</span>'+c.id+' '+esc(c.title)+' (in progress)</span>'};
    $('pager').innerHTML=link(D.courses[i-1],'Previous','left')+link(D.courses[i+1],'Next','right');
  }).catch(function(){});
  $('c-updated').textContent='Last updated '+C.updated;
})();
</script>
